services:
  xbackbone:
    image: xbackbone:3.8.2-qol
    build: .
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-Etc/UTC}"
      APP_URL: "${APP_URL:?Set your existing public HTTPS URL}"
      UPLOAD_MAX_BYTES: "${UPLOAD_MAX_BYTES:-21474836480}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_SECURITY: "${SMTP_SECURITY:-tls}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM_ADDRESS: "${SMTP_FROM_ADDRESS:-}"
      SMTP_FROM_NAME: "${SMTP_FROM_NAME:-XBackBone}"
      OIDC_ENABLED: "${OIDC_ENABLED:-false}"
      OIDC_ISSUER: "${OIDC_ISSUER:-}"
      OIDC_CLIENT_ID: "${OIDC_CLIENT_ID:-}"
      OIDC_CLIENT_SECRET: "${OIDC_CLIENT_SECRET:-}"
      OIDC_AUTO_REGISTER: "${OIDC_AUTO_REGISTER:-false}"
    volumes:
      - /opt/xbb/config:/config
      - /mnt/data/:/mnt/data
