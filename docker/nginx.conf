user www-data;
worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    sendfile on;
    server_tokens off;
    client_max_body_size 21g;
    client_body_timeout 3600s;
    server {
        listen 80;
        include /etc/nginx/xbackbone-tls.conf;
        root /app/www/public;
        index index.php;
        location / { try_files $uri $uri/ /index.php?$query_string; }
        location = /index.php {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            fastcgi_param HTTP_PROXY "";
            fastcgi_param HTTPS $https if_not_empty;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_read_timeout 3600s;
            fastcgi_request_buffering off;
        }
        location ~ ^/(app|bin|bootstrap|docker|resources|storage|vendor|logs|tests|install)(/|$) { deny all; }
        location ~ \.php$ { return 404; }
        location ~ /\. { deny all; }
        location ~ ^/(composer|package)[^/]*\.json$ { deny all; }
        location ~ ^/(composer|package)[^/]*\.lock$ { deny all; }
    }
}
